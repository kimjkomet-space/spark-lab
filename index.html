<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SparkLab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
:root{--plum:#21183D;--purple:#7855B7;--lav:#B69AE9;--lilac:#E8DDF8;--cream:#FBF8F2;--gold:#F4C95D;--ink:#21183D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--plum);color:var(--ink);font:400 16px/1.6 "Nunito Sans",system-ui,sans-serif}
h1,h2,h3,h4{font-family:Fredoka,"Trebuchet MS",sans-serif;line-height:1.15;margin:0 0 .5em;font-weight:600}
h1{font-size:clamp(2.2rem,5.5vw,3.8rem)}h2{font-size:clamp(1.6rem,3.4vw,2.3rem)}h3{font-size:1.25rem}
p{margin:0 0 1em;max-width:68ch}a{color:var(--purple)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.stars{background:radial-gradient(circle at 15% 20%,rgba(182,154,233,.35),transparent 38%),radial-gradient(circle at 85% 70%,rgba(120,85,183,.5),transparent 42%),radial-gradient(1.5px 1.5px at 12% 30%,#fff,transparent),radial-gradient(2px 2px at 40% 15%,var(--gold),transparent),radial-gradient(1.5px 1.5px at 70% 40%,#fff,transparent),radial-gradient(2px 2px at 88% 18%,var(--lav),transparent),radial-gradient(1.5px 1.5px at 55% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 25% 75%,var(--gold),transparent),var(--plum);color:#fff}
.nav{position:sticky;top:0;z-index:20;background:rgba(33,24,61,.94);backdrop-filter:blur(8px);border-bottom:1px solid rgba(182,154,233,.25);padding-top:env(safe-area-inset-top,0px)}
.nav .wrap{display:flex;align-items:center;gap:18px;min-height:68px;flex-wrap:wrap}
.logo{background:#fff;border-radius:14px;padding:4px 12px;display:flex;border:0;cursor:pointer}
.logo img{height:40px;width:auto;display:block}
.links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.links button{background:none;border:0;color:var(--lilac);padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.92rem}
.links button:hover{background:rgba(182,154,233,.18)}
.links button[aria-current=page]{background:var(--gold);color:var(--plum)}
.menu{display:none;margin-left:auto;background:var(--purple);border:0;color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700}
@media(max-width:860px){.menu{display:block}.links{display:none;width:100%;flex-direction:column;margin:0 0 12px}.links.open{display:flex}.links button{text-align:left;padding:12px 14px}}
.btn{display:inline-block;border:0;border-radius:999px;padding:13px 26px;font-weight:700;font-family:Fredoka,sans-serif;font-size:1.05rem;cursor:pointer;text-decoration:none}
.gold{background:var(--gold);color:var(--plum);box-shadow:0 4px 0 #c9a23f}.gold:hover{transform:translateY(1px);box-shadow:0 3px 0 #c9a23f}
.ghost{background:transparent;color:#fff;border:2px solid var(--lav)}
.solid{background:var(--purple);color:#fff}
.hero{padding:64px 0 80px;position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero .lead{font-size:1.15rem;color:#F6F0FF}
.tag{font-family:Fredoka;font-size:1.3rem;color:var(--gold);letter-spacing:.02em;margin-bottom:.4em}
.lab{background:var(--cream);border-radius:28px;padding:26px;color:var(--ink);box-shadow:0 0 0 6px rgba(182,154,233,.3),0 24px 60px rgba(0,0,0,.4);transform:rotate(1.5deg)}
.lab img{width:100%;display:block}
.lab .mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}.lab{transform:none}}
.sec{padding:60px 0}.cream{background:var(--cream)}.lilac{background:var(--lilac)}
.sec>.wrap>h2{margin-bottom:.2em}.sub{color:#33265c;margin-bottom:28px}
.dark .sub,.stars .sub{color:var(--lilac)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:#fff;border-radius:20px;padding:22px;border:1px solid #e3d8f4;box-shadow:0 2px 0 var(--lilac)}
.card h3{color:var(--plum)}.card.feat{border-top:6px solid var(--purple)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{background:var(--lilac);color:var(--plum);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:700;border:0}
.chip.g{background:var(--gold)}
button.chip{cursor:pointer;padding:7px 14px;font-size:.9rem}
button.chip[aria-pressed=true]{background:var(--purple);color:#fff}
.steps{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));counter-reset:s}
.step{background:var(--plum);color:#fff;border-radius:20px;padding:22px;position:relative}
.step:before{counter-increment:s;content:counter(s);position:absolute;top:-14px;left:18px;background:var(--gold);color:var(--plum);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 1rem Fredoka}
.step p{color:#F6F0FF;margin:0;font-size:.95rem}
.band{background:var(--purple);color:#fff;border-radius:24px;padding:32px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.band h2{margin:0 0 .2em}.band p{margin:0;color:#fff}
.page-head{padding:56px 0 44px}.page-head p{color:#F6F0FF;font-size:1.1rem}
.note{background:#fff8e1;border-left:5px solid var(--gold);border-radius:10px;padding:12px 16px;font-size:.92rem;margin-bottom:22px;color:var(--plum)}
.bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
input,select,textarea{width:100%;background:#fff;border:2px solid var(--lilac);border-radius:12px;padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--purple)}
label{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px;color:var(--plum)}
.form{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}.form .full{grid-column:1/-1}
@media(max-width:620px){.form{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.paths button{text-align:left;background:#fff;border:2px solid var(--lilac);border-radius:16px;padding:14px;cursor:pointer}
.paths button[aria-pressed=true]{border-color:var(--purple);background:var(--lilac)}
.paths b{font-family:Fredoka;display:block;color:var(--purple)}
@media(max-width:560px){.paths{grid-template-columns:1fr}}
.outline{list-style:none;margin:0;padding:0;counter-reset:o}
.outline li{counter-increment:o;padding:8px 0 8px 38px;border-bottom:1px dashed var(--lav);position:relative;font-weight:600}
.outline li:before{content:counter(o);position:absolute;left:0;top:7px;width:26px;height:26px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-size:.8rem}
.paper{background:#fff;border:1px solid #ddd;border-radius:6px;padding:22px;font-family:Georgia,serif;box-shadow:0 10px 30px rgba(33,24,61,.15)}
.paper h4{font-family:Georgia,serif;margin:.8em 0 .2em;color:#222}.paper p{font-size:.95rem}
.tbl{width:100%;border-collapse:collapse;min-width:560px}
.tbl th{text-align:left;font-size:.85rem;padding:8px;background:var(--lilac)}.tbl td{padding:6px 8px;border-bottom:1px solid var(--lilac)}
.tbl input{padding:6px 8px}.scroll{overflow-x:auto;background:#fff;border-radius:16px;border:1px solid #e3d8f4}
.stat{background:var(--plum);color:#fff;border-radius:18px;padding:18px}
.stat b{display:block;font:700 2rem Fredoka;color:var(--gold)}
.stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:20px}
.ok{color:#1d7a46;font-weight:700}.bad{color:#b3261e;font-weight:700}
.foot{padding:36px 0;color:#F1E9FF;font-size:.9rem}.foot .wrap{display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap}
ul.tight{margin:0 0 12px;padding-left:20px}
@media(prefers-reduced-motion:no-preference){.twinkle{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.4;transform:scale(.85)}}}
.spark{position:absolute;color:var(--gold);font-size:1.6rem}

::placeholder{color:#5f5282;opacity:1}
.hero.stars{background:radial-gradient(60% 90% at 82% 35%,rgba(120,85,183,.85),transparent 70%),radial-gradient(45% 70% at 8% 95%,rgba(182,154,233,.4),transparent 70%),radial-gradient(1.5px 1.5px at 12% 30%,#fff,transparent),radial-gradient(2px 2px at 40% 15%,var(--gold),transparent),radial-gradient(1.5px 1.5px at 70% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 80%,#fff,transparent),var(--plum)}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(to bottom,transparent,rgba(120,85,183,.6));pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sky .tw{transform-box:fill-box;transform-origin:center}
.lab{box-shadow:0 0 0 6px rgba(182,154,233,.35),0 0 90px rgba(182,154,233,.5),0 24px 60px rgba(0,0,0,.4)}
.muted{color:#33265c}
.flash{background:#fff;border-left:5px solid var(--purple);border-radius:10px;padding:10px 14px}
.ghostdark{background:transparent;color:var(--plum);border:2px solid var(--purple)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.tools .btn{padding:10px 20px;font-size:.98rem}
.btn:disabled{opacity:.6;cursor:wait}
.spark-box{background:var(--plum);color:#fff;border-radius:20px;padding:18px 22px;margin:18px 0}
.spark-box h3{color:var(--gold)}.spark-box p,.spark-box li{color:#F6F0FF}
.tl{display:flex;height:36px;border-radius:10px;overflow:hidden;margin:8px 0 4px}
.tl span{display:grid;place-items:center;font-size:.78rem;font-weight:700;color:#fff;overflow:hidden}
.c0{background:var(--plum)}.c1{background:var(--purple)}.c2{background:#5A3F94}.c3{background:var(--gold);color:var(--plum)!important}.c4{background:var(--lav);color:var(--plum)!important}
.tlkey{font-size:.88rem;margin-bottom:18px}
.pgr{font-family:Georgia,"Times New Roman",serif;color:#1c1c1c;background:#fff;border:1px solid #cfc6e3;border-radius:8px;padding:28px 30px;box-shadow:0 10px 30px rgba(33,24,61,.18);margin-bottom:24px}
.pgr-head{border-bottom:3px solid var(--purple);padding-bottom:12px;margin-bottom:4px;display:flex;gap:14px;justify-content:space-between;align-items:flex-start}
.pgr-head>div{flex:1}
.pgr-org{font:600 1.9rem Fredoka,sans-serif;color:var(--plum)}.pgr-line{font-size:1.1rem}.pgr-badge{font-size:.9rem;font-style:italic;margin-top:4px}
.pgr-topic{font-size:1.25rem;font-weight:700;margin:0}
.pgr-row{display:grid;grid-template-columns:140px 1fr;gap:16px;padding:16px 0;border-top:1px solid #d9d2ea}
.pgr-label{font-weight:700;color:#4b3585}
.pgr h4{font-family:inherit;font-size:1rem;margin:.9em 0 .2em;color:var(--plum)}
.pgr p,.pgr li{font-size:.97rem;max-width:none}.pgr ul.tight,.pgr ol.tight{margin-bottom:8px}
.pgr .grp{font-weight:700;margin:.6em 0 .1em}
.act-name{font-size:1.1rem;font-weight:700}
.mins{display:inline-block;background:var(--lilac);border-radius:999px;padding:1px 10px;font-size:.82rem;font-weight:700;color:var(--plum);font-family:"Nunito Sans",sans-serif}
.adapt{font-style:italic}
.promise{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:#faf7ff;border:1px solid #e3d8f4;border-radius:8px;padding:10px 14px;margin-top:8px}
.promise p{margin:2px 0 0;font-size:.9rem}
.ed{width:100%;font:inherit;font-size:.95rem;border:2px solid var(--lav);border-radius:8px;padding:8px;background:#fdfbff;margin:2px 0 8px;color:#1c1c1c}
.pgr label{font-family:"Nunito Sans",sans-serif;font-size:.85rem;margin-top:6px}
.minfield{display:inline-flex!important;align-items:center;gap:8px;margin:4px 0 8px}.minfield input{width:80px;padding:4px 8px}
.row-tools{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.pgr-h2{font-family:Fredoka,sans-serif;color:var(--plum)}
@media(max-width:620px){.pgr{padding:18px}.pgr-row{grid-template-columns:1fr;gap:6px}.promise{grid-template-columns:1fr}.pgr-head{flex-direction:column}}
@media print{
 html,body{background:#fff!important}
 .nav,.foot,.page-head,.no-print{display:none!important}
 .sec,.guide-sec{padding:0!important;background:#fff!important}
 .wrap{max-width:none;padding:0}
 .pgr{border:0;box-shadow:none;padding:0;border-radius:0}
 .pgr-row h4{break-after:avoid}
 .appendix{break-before:page}
 input,select,textarea{border:0!important;background:none!important;padding:0!important}
 a{color:#000}
 @page{margin:.6in}
}
</style>
</head>

const BADGE_IDEAS=(topic,area)=>{
 const s=(topic+" "+area).toLowerCase();
 if(/sound|music|rhythm|vibrat/.test(s))return ["Science and discovery","Inventing and engineering design","Music and performing arts"];
 if(/art|design|paint/.test(s))return ["Visual arts and design","Performing arts and movement"];
 if(/code|comput|binary|robot|technolog/.test(s))return ["Coding and computer science","Robotics and technology"];
 if(/money|financ|budget|math/.test(s))return ["Financial literacy","Math in everyday life"];
 if(/energy|environment|outdoor|nature|solar|wind/.test(s))return ["Environment and conservation","Renewable energy and engineering"];
 if(/space|star|planet/.test(s))return ["Space science","Astronomy and discovery"];
 return ["STEM exploration and discovery","Inventing and engineering design"];
};

const VARIANT_COUNT=2;
const rowsFromMats=m=>m.map(x=>[x.name,x.qty,x.price,x.type,x.id]);
function mergeRows(rows,oldM,newM){
 const oldById=Object.fromEntries(oldM.map(m=>[m.id,m])),newById=Object.fromEntries(newM.map(m=>[m.id,m]));
 const keep=rows.filter(r=>!(oldById[r[4]]&&!newById[r[4]])).map(r=>{
  const o=oldById[r[4]],nw=newById[r[4]];
  return(o&&nw&&+r[1]===o.qty&&+r[2]===o.price)?[r[0],nw.qty,nw.price,nw.type,r[4]]:r;});
 const have=new Set(keep.map(r=>r[4]));
 return [...keep,...rowsFromMats(newM.filter(m=>!have.has(m.id)))];
}

  const P={home:h(Home,{go}),badges:h(Badges,{go,send}),builder:h(Builder,{draft,setDraft,program,setProgram,bud,setBud,go,saved,persist}),library:h(Library,{send}),budget:h(Budget,{bud,setBud,program,go}),about:h(About)}[page];
  return h(React.Fragment,null,h(Nav,{page,go}),h("main",null,P),h(Footer,{go}));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
